<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Mes projets GitHub Pages</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b949e;
      margin-bottom: 30px;
    }

    #projects {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 22px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #58a6ff;
      transform: translateY(-3px);
    }

    .card h2 {
      font-size: 18px;
      margin: 0 0 10px;
    }

    .card p {
      color: #8b949e;
      margin: 0 0 18px;
    }

    .card span {
      color: #58a6ff;
      font-size: 14px;
    }

    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font: inherit;
    }

    #empty {
      color: #8b949e;
    }

    footer {
      margin-top: 40px;
      color: #8b949e;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <h1>Krazy GitHub Pages</h1>

    <input
      id="search"
      type="search"
      placeholder="Rechercher un projet..."
      aria-label="Rechercher un projet"
    >

    <section id="projects"></section>
    <p id="empty" hidden>Aucun projet trouvé.</p>

  </main>

<script>
  // Configuration
  const username = "krazykays";

  const projects = [
    "kattak",
    "krazydartapp",
    "krazyidle",
    "krazymap",
    "krazyverse",
    "krazygrid",
    "krazytroopers"
  ];

  // Génération de la liste
  const container = document.getElementById("projects");
  const search = document.getElementById("search");
  const empty = document.getElementById("empty");

  function renderProjects(query = "") {
    container.replaceChildren();

    const filtered = projects.filter(project =>
      project.toLowerCase().includes(query.toLowerCase())
    );

    filtered.forEach(project => {
      const link = document.createElement("a");
      link.className = "card";
      link.href =
        `https://${username}.github.io/${project}/`;

      const title = document.createElement("h2");
      title.textContent = project;

      const action = document.createElement("span");
      action.textContent = "Ouvrir le projet ↗";

      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.append(title, action);

      container.appendChild(link);
    });

    empty.hidden = filtered.length > 0;
  }

  search.addEventListener("input", () => {
    renderProjects(search.value);
  });

  renderProjects();
</script>
</body>
</html>
