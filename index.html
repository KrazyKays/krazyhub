<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <title>Mes projets GitHub Pages</title>

  <style>
    body {
      margin: 0;
      padding: 40px 20px;
      font-family: system-ui, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    main {
      max-width: 1000px;
      margin: auto;
    }

    h1 {
      margin-bottom: 8px;
    }

    .subtitle {
      color: #8b949e;
      margin-bottom: 30px;
    }

    #projects {
      display: grid;
      grid-template-columns:
        repeat(auto-fit, minmax(230px, 1fr));
      gap: 16px;
    }

    .card {
      display: block;
      padding: 22px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color 0.2s, transform 0.2s;
    }

    .card:hover {
      border-color: #58a6ff;
      transform: translateY(-3px);
    }

    .card header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
    }

    .card h2 {
      font-size: 18px;
      margin: 0;
    }

    .icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      border-radius: 6px;
      object-fit: contain;
    }

    .icon-fallback {
      display: grid;
      place-items: center;
      background: #30363d;
      color: #e6edf3;
      font-weight: 600;
      text-transform: uppercase;
    }

    .card .updated {
      display: block;
      color: #8b949e;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .card p {
      color: #8b949e;
      margin: 0 0 18px;
    }

    .card span {
      color: #58a6ff;
      font-size: 14px;
    }

    #search {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      margin-bottom: 20px;
      border-radius: 8px;
      border: 1px solid #30363d;
      background: #161b22;
      color: #e6edf3;
      font: inherit;
    }

    #empty {
      color: #8b949e;
    }

    footer {
      margin-top: 40px;
      color: #8b949e;
      font-size: 13px;
      text-align: center;
    }
  </style>
</head>

<body>
  <main>
    <h1>Krazy GitHub Pages</h1>

    <input
      id="search"
      type="search"
      placeholder="Rechercher un projet..."
      aria-label="Rechercher un projet"
    >

    <section id="projects"></section>
    <p id="empty" hidden>Aucun projet trouvé.</p>

  </main>

<script>
  // Configuration
  const username = "krazykays";

  const projects = [
    "kattak",
    "krazydartapp",
    "ktyper",
    "krazymap",
    "krazyverse",
    "krazygrid",
    "krazytroopers"
  ];

  // Génération de la liste
  const container = document.getElementById("projects");
  const search = document.getElementById("search");
  const empty = document.getElementById("empty");

  // Métadonnées chargées en asynchrone
  const icons = {};
  const pushedAt = {};

  const relative = new Intl.RelativeTimeFormat("fr", { numeric: "auto" });

  function formatRelative(date) {
    const seconds = (date - Date.now()) / 1000;
    const units = [
      ["year", 31536000],
      ["month", 2592000],
      ["week", 604800],
      ["day", 86400],
      ["hour", 3600],
      ["minute", 60]
    ];
    for (const [unit, size] of units) {
      if (Math.abs(seconds) >= size) {
        return relative.format(Math.round(seconds / size), unit);
      }
    }
    return "à l'instant";
  }

  async function loadIcon(project) {
    const base = `https://${username}.github.io/${project}/`;
    try {
      const html = await (await fetch(base)).text();
      const doc = new DOMParser().parseFromString(html, "text/html");
      const link = doc.querySelector('link[rel~="icon"]');
      if (link) return new URL(link.getAttribute("href"), base).href;
    } catch {}
    return new URL("favicon.ico", base).href;
  }

  async function loadPushedAt() {
    const cacheKey = "repos-pushed-at";
    try {
      const cached = JSON.parse(localStorage.getItem(cacheKey));
      if (cached && Date.now() - cached.time < 10 * 60 * 1000) {
        return cached.data;
      }
    } catch {}

    const response = await fetch(
      `https://api.github.com/users/${username}/repos?per_page=100`
    );
    if (!response.ok) return {};
    const data = Object.fromEntries(
      (await response.json()).map(repo => [repo.name, repo.pushed_at])
    );
    try {
      localStorage.setItem(cacheKey, JSON.stringify({ time: Date.now(), data }));
    } catch {}
    return data;
  }

  function createIcon(project) {
    const fallback = document.createElement("span");
    fallback.className = "icon icon-fallback";
    fallback.textContent = project[0];

    if (!icons[project]) return fallback;

    const img = document.createElement("img");
    img.className = "icon";
    img.src = icons[project];
    img.alt = "";
    img.onerror = () => img.replaceWith(fallback);
    return img;
  }

  function renderProjects(query = "") {
    container.replaceChildren();

    const filtered = projects.filter(project =>
      project.toLowerCase().includes(query.toLowerCase())
    );

    filtered.forEach(project => {
      const link = document.createElement("a");
      link.className = "card";
      link.href =
        `https://${username}.github.io/${project}/`;

      const header = document.createElement("header");
      const title = document.createElement("h2");
      title.textContent = project;
      header.append(createIcon(project), title);

      const updated = document.createElement("small");
      updated.className = "updated";
      if (pushedAt[project]) {
        const date = new Date(pushedAt[project]);
        updated.textContent = `Mis à jour ${formatRelative(date)}`;
        updated.title = date.toLocaleString("fr-FR");
      }

      const action = document.createElement("span");
      action.textContent = "Ouvrir le projet ↗";

      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.append(header, updated, action);

      container.appendChild(link);
    });

    empty.hidden = filtered.length > 0;
  }

  search.addEventListener("input", () => {
    renderProjects(search.value);
  });

  renderProjects();

  projects.forEach(async project => {
    icons[project] = await loadIcon(project);
    renderProjects(search.value);
  });

  loadPushedAt()
    .then(data => {
      Object.assign(pushedAt, data);
      renderProjects(search.value);
    })
    .catch(() => {});
</script>
</body>
</html>
